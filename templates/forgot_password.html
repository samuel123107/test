{% extends "base.html" %}

{% block content %}
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:80px 20px">
    <div class="card fadeup" style="width:100%;max-width:420px;padding:44px 40px;box-shadow:0 40px 80px rgba(0,0,0,0.5)">
        <div style="margin-bottom:32px">
            <div style="font-size:11px;color:#a8ff3e;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px">Password Recovery</div>
            <h1 style="font-size:26px;font-weight:800;letter-spacing:-.03em;color:#e8eaf0">Forgot password?</h1>
            <p style="font-size:13px;color:#4a5270;margin-top:8px">Enter your username to receive a reset link.</p>
        </div>
        <form id="forgot-form">
            <div style="display:flex;flex-direction:column;gap:18px">
                <div><label class="input-label">Username</label><input class="input-field" type="text" id="username" name="username" placeholder="Student123" required/></div>
                <div id="msg" style="display:none;font-size:12.5px;border-radius:8px;padding:10px 14px"></div>
                <button class="btn-primary" type="submit" id="btn" style="width:100%;justify-content:center;font-size:14px;padding:14px;margin-top:4px">Send Reset Link →</button>
            </div>
        </form>
        <div style="margin-top:24px;text-align:center;font-size:13px;color: #3a4055"><a href="{{ url_for('login') }}" style="color:#a8ff3e;text-decoration:none">Back to login</a></div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    const form = document.getElementById('forgot-form');
    const msgDiv = document.getElementById('msg');
    const btn = document.getElementById('btn');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = document.getElementById('username').value;
        const csrfToken = document.querySelector('meta[name="csrf-token"]').getAttribute('content');

        msgDiv.style.display = 'none';
        btn.disabled = true;
        btn.innerHTML = 'Sending...';

        try {
            const resp = await fetch('/forgot-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrfToken },
                body: JSON.stringify({ username })
            });
            const data = await resp.json();
            msgDiv.style.display = 'block';
            if (data.success) {
                msgDiv.style.background = 'rgba(168, 255, 62, 0.08)';
                msgDiv.style.border = '1px solid rgba(168, 255, 62, 0.2)';
                msgDiv.style.color = '#a8ff3e';
                msgDiv.innerHTML = `Link generated! <a href="${data.reset_url}" style="color: #fff; text-decoration: underline;">Click here to reset</a>`;
            } else {
                msgDiv.style.background = 'rgba(248, 113, 113, 0.08)';
                msgDiv.style.border = '1px solid rgba(248, 113, 113, 0.2)';
                msgDiv.style.color = '#f87171';
                msgDiv.textContent = 'User not found';
                btn.disabled = false;
                btn.innerHTML = 'Send Reset Link →';
            }
        } catch (err) { console.error(err); }
    });
</script>
{% endblock %}
